<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>3D Snow Bike Racer</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<div id="vignette"></div>

<div id="hud">
  <div class="hud-box" id="score-box">SCORE<span id="score-val">0</span></div>
  <div class="hud-box hud-btn" id="pause-box">⏸</div>
  <div class="hud-box" id="speed-box">KM/H<span id="speed-val">0</span></div>
</div>

<div id="center-msg">
  <div id="startscreen">
    <h1>🏍️ 3D Snow Bike Racer</h1>
    <p>Dodge riders on the icy road. Grab boosts. Survive as long as you can.</p>
    <div id="tapstart">TAP TO START</div>
  </div>
  <div id="gameover">
    <h1>💥 Crashed!</h1>
    <p>Final Score: <span id="final-score">0</span></p>
    <div id="tapstart2" class="tapstart-like">TAP TO RETRY</div>
  </div>
  <div id="pausescreen" style="display: none;">
    <h1>⏸ Paused</h1>
    <div id="resume-btn" class="tapstart-like">RESUME</div>
    <div id="restart-btn" class="tapstart-like" style="margin-top: 12px; background: linear-gradient(135deg,#666,#444); color: #fff;">RESTART</div>
  </div>
</div>

<div id="controls">
  <div id="steer-pad">
    <div class="ctrl-btn" id="btn-left">◀</div>
    <div class="ctrl-btn" id="btn-right">▶</div>
  </div>
  <div id="gas-pad">
    <div class="ctrl-btn" id="btn-brake">🛑</div>
    <div class="ctrl-btn" id="btn-gas">⬆️</div>
  </div>
</div>

<div id="hint">Arrow Keys / WASD to steer &amp; boost &nbsp;|&nbsp; 🟡 Golden rings = +50 pts &nbsp;|&nbsp; Or use on-screen buttons</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/shaders/CopyShader.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/shaders/LuminosityHighPassShader.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/EffectComposer.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/RenderPass.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/ShaderPass.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/UnrealBloomPass.js"></script>
<script src="script.js"></script>
</body>
</html>
