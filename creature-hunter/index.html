  <meta name="theme-color" content="#040818">
  <title>Creature Hunter</title>
  <style>
    html, body { margin: 0; height: 100%; overflow: hidden; background: #060b1c; }

    #overlay {
      position: fixed; inset: 0; display: flex; flex-direction: column;
      align-items: center; justify-content: center; gap: 14px;

    #overlay h1 { margin: 0; font-size: 42px; letter-spacing: 2px; }
    #overlay p { margin: 0; opacity: 0.85; font-size: 16px; line-height: 1.7; }
    #overlay b { color: #ffd27a; }
  </style>
</head>

  <!-- match shuru hone par menu.js isse dikhata hai -->

    <p><b>W A S D</b> chalo &nbsp;|&nbsp; <b>Shift</b> daudo &nbsp;|&nbsp; <b>Space</b> jump<br />
